[workspace]
resolver = "2"
members = ["crates/probe", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
# 许可证已定：GPL-3.0-or-later（设计文档附录 A 决策 6）。
# 原因：预览片需要 H.264 编码，而 ffmpeg 的 libx264 是 GPL；项目捆绑 GPL 版 ffmpeg。
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
