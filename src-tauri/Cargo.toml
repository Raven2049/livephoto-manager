[package]
name = "liveporter"
version = "1.0.0"
description = "LivePorter - iPhone Live Photos manager for Windows"
authors = ["Raven2049"]
edition = "2021"
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "liveporter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http-range = "0.1.5"
percent-encoding = "2.3.2"
tauri-plugin-dialog = "2.7.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow.workspace = true
windows = { version = "0.58", features = ["Win32_Devices_PortableDevices", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation"] }
sha2 = "0.11.0"
trash = "5"
